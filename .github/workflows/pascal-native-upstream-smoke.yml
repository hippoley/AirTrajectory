name: pascal-native-upstream-smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/run-pascal-native.sh"
      - "scripts/start-full-editor.sh"
      - "compose.pascal-native.yml"
      - "tests/pascal-native-browser-smoke.cjs"
      - "integrations/pascal-studio/**"
      - ".github/workflows/pascal-native-upstream-smoke.yml"

jobs:
  native-editor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned native Pascal editor
        uses: actions/checkout@v4
        with:
          repository: pascalorg/editor
          ref: 7fc874faec800e18f8be2dab78e7dc2ff2327bd7
          path: _pascal_native
          persist-credentials: false
      - name: Verify upstream identity and MIT license
        shell: bash
        run: |
          test "$(git -C _pascal_native rev-parse HEAD)" = 7fc874faec800e18f8be2dab78e7dc2ff2327bd7
          grep -q "MIT License" _pascal_native/LICENSE
          test -f _pascal_native/apps/editor/app/page.tsx
          test -f _pascal_native/packages/editor/src/index.tsx
          grep -q 'layoutVersion="v2"' _pascal_native/apps/editor/app/page.tsx
          grep -q "BuildTab" _pascal_native/apps/editor/app/page.tsx
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Validate production native frontend launcher
        run: |
          bash -n scripts/start-full-editor.sh
          bash -n scripts/run-pascal-native.sh
          mkdir -p .upstream
          ln -s ../_pascal_native .upstream/pascal-editor
          docker compose -f compose.pascal-native.yml config
          test -f _pascal_native/Dockerfile
          grep -q 'PASCAL_DATA_DIR=/data' _pascal_native/Dockerfile
      - name: Install upstream workspace dependencies
        working-directory: _pascal_native
        run: bun install --frozen-lockfile
      - name: Validate native scene editor
        working-directory: _pascal_native
        run: bunx turbo run check-types --filter=editor
      - name: Build complete native Pascal Next.js application
        working-directory: _pascal_native
        env:
          SKIP_ENV_VALIDATION: "1"
          PASCAL_PORTABLE_BUILD: "1"
        run: bunx turbo run build --filter=editor
      - name: Start full editor and verify HTTP boot
        working-directory: _pascal_native/apps/editor
        env:
          PORT: "3002"
          NODE_ENV: production
          PASCAL_DATA_DIR: /tmp/pascal-airtrajectory-scenes
        run: |
          mkdir -p "$PASCAL_DATA_DIR"
          (bun run start > /tmp/pascal-native-editor.log 2>&1 & echo $! > /tmp/pascal-native-editor.pid)
          healthy=0
          for i in $(seq 1 35); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3002/ > /tmp/pascal-native-editor.html; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then tail -n 100 /tmp/pascal-native-editor.log; exit 1; fi
          grep -q -E '<html|<!DOCTYPE html' /tmp/pascal-native-editor.html
          echo "PASS authentic Pascal production editor HTTP entrypoint"
      - name: Install headless browser
        run: |
          mkdir -p /tmp/pascal-smoke
          npm install --prefix /tmp/pascal-smoke --no-save --no-package-lock playwright@1.56.1
          /tmp/pascal-smoke/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify native editor interaction shell in Chromium
        env:
          NODE_PATH: /tmp/pascal-smoke/node_modules
        run: node tests/pascal-native-browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pascal-native-frontend-evidence
          path: artifacts/pascal-native/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pascal-native-build-logs
          path: /tmp/pascal-native-editor.log
