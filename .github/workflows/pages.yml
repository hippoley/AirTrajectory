name: deploy-pages
on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "web/**"
      - "airtrajectory/**"
      - "examples/export_web_scenarios.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Generate backend scenarios
        run: python examples/export_web_scenarios.py
      - name: Validate generated artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("web/data/scenarios.json")
          assert path.exists()
          p = json.loads(path.read_text())
          assert p["backend"] == "toy-multizone-v1"
          assert len(p["scenarios"]) == 4
          assert p["baseline"] == "exhaustive-opening-search-v1"
          assert all(len(s["series"]) > 1 for s in p["scenarios"])
          assert all(len(s["frames"]) == len(s["series"]) for s in p["scenarios"])
          assert all("living" in s["frames"][0]["co2"] for s in p["scenarios"])
          assert all("openings" in s["frames"][0] for s in p["scenarios"])
          print("validated", path, "with", len(p["scenarios"]), "branches")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
