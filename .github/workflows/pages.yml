name: deploy-pages
on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "web/**"
      - "airtrajectory/**"
      - "examples/export_web_scenarios.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Generate backend scenarios
        run: python examples/export_web_scenarios.py
      - name: Validate generated artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("web/data/scenarios.json")
          assert path.exists()
          p = json.loads(path.read_text())
          assert p["backend"] == "toy-multizone-v1"
          assert len(p["scenarios"]) == 4
          assert p["baseline"] == "exhaustive-opening-search-v1"
          assert all(len(s["series"]) > 1 for s in p["scenarios"])
          assert all(len(s["frames"]) == len(s["series"]) for s in p["scenarios"])
          assert all("living" in s["frames"][0]["co2"] for s in p["scenarios"])
          assert all("openings" in s["frames"][0] for s in p["scenarios"])
          assert all(s["frames"][0]["field"]["backend"] == "fast-field-v1" for s in p["scenarios"])
          assert all(len(s["frames"][0]["field"]["vectors"]) > 100 for s in p["scenarios"])
          assert all(s["frames"][0]["field"]["grid"] == {"x0": 180, "y0": 120, "dx": 35, "dy": 35, "nx": 19, "ny": 13} for s in p["scenarios"])
          assert all(set(s["frames"][0]["field"]["opening_flow_estimate"]) == {"W1","W2","W3","D1","D2"} for s in p["scenarios"])
          print("validated", path, "with", len(p["scenarios"]), "branches")
          PY
      - name: Validate filament renderer
        run: |
          node --check web/lab.js
          grep -q 'function advect' web/lab.js
          grep -q 'function backendVelocity' web/lab.js
          grep -q 'function openingFlow' web/lab.js
          grep -q 'opening_flow_estimate' web/lab.js
          grep -q 'function jetResponse' web/lab.js
          grep -q 'function wallResponse' web/lab.js
          grep -q 'function crossesSolidWall' web/lab.js
          grep -q 'throughD2' web/lab.js
          grep -q 'function emissionWeight' web/lab.js
          grep -q 'function reseedForField' web/lab.js
          grep -q 'function drawFlowSkeleton' web/lab.js
          grep -q 'function drawCo2Overlay' web/lab.js
          grep -q 'viewMode!=="dead"' web/lab.js
          grep -q 'data-view="flow"' web/index.html
          grep -q 'data-view="co2"' web/index.html
          grep -q 'data-view="dead"' web/index.html
          grep -q 'function invalidateTrajectory' web/lab.js
          grep -q 'function requestPhysicsRerun' web/lab.js
          grep -q 'TRAJECTORY STALE' web/lab.js
          grep -q 'id="topologyRevision"' web/index.html
          grep -q 'function constrainOpeningToWall' web/lab.js
          grep -q 'pointerdown' web/lab.js
          grep -q 'pointerup' web/lab.js
          grep -q 'moved along wall' web/lab.js
          grep -q 'function hitSharedWall' web/lab.js
          grep -q 'function resizeLivingBedroomWall' web/lab.js
          grep -q 'function wallSegment' web/lab.js
          grep -q 'function syncOpeningGeometry' web/lab.js
          grep -q 'wallId:"living-bedroom"' web/lab.js
          grep -q 'wallId:"living-study"' web/lab.js
          grep -q 'shared wall resized' web/lab.js
          grep -q 'id:"D2"' web/lab.js
          grep -q 'p.trail.length>20' web/lab.js
          grep -q 'Midpoint/RK2 advection' web/lab.js
          ! grep -q 'Array.from({length:720}' web/lab.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
