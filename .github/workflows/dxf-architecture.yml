name: DXF Architectural Skeleton
on:
  push:
    branches: [main]
    paths:
      - 'web/dxf-architecture-extract.js'
      - 'web/dxf-cad-webgl.js'
      - 'tests/test_dxf_architecture_extract.mjs'
      - '.github/workflows/dxf-architecture.yml'
  pull_request:
    paths:
      - 'web/dxf-architecture-extract.js'
      - 'web/dxf-cad-webgl.js'
      - 'tests/test_dxf_architecture_extract.mjs'
      - '.github/workflows/dxf-architecture.yml'
jobs:
  extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module tests/test_dxf_architecture_extract.mjs
