name: contam-real-smoke
on:
  pull_request:
    paths:
      - "airtrajectory/contam.py"
      - "examples/contam_smoke.py"
      - "pyproject.toml"
      - ".github/workflows/contam-smoke.yml"
  workflow_dispatch:

jobs:
  real-contam:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AirTrajectory and official contamxpy
        run: python -m pip install -e ".[contam]"
      - name: Download official contamxpy source demos
        run: python -m pip download --no-deps --no-binary=:all: contamxpy==0.0.9 -d _contam_sdist
      - name: Extract NIST demo PRJ
        shell: bash
        run: |
          python - <<'PY'
          import glob, tarfile
          archive=glob.glob("_contam_sdist/contamxpy-0.0.9.tar.gz")[0]
          with tarfile.open(archive) as tf:
              tf.extractall("_contam_src")
          matches=glob.glob("_contam_src/**/demo_files/test_OneZoneSS-UseApi.prj",recursive=True)
          if not matches:
              matches=glob.glob("_contam_src/**/demo_files/test_GetPrjInfo.prj",recursive=True)
          assert matches, "official contamxpy sdist did not contain a demo PRJ"
          open("_contam_prj.txt","w").write(matches[0])
          print(matches[0])
          PY
      - name: Run real CONTAM engine
        shell: bash
        run: |
          PRJ="$(cat _contam_prj.txt)"
          python examples/contam_smoke.py "$PRJ" --zone 1 --contaminant 1 --steps 2 | tee contam-smoke.json
          grep -q 'CONTAM_EXECUTED' contam-smoke.json
