name: studio-us1-browser-e2e
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/studio.html"
      - "web/studio.js"
      - "web/vendor/**"
      - "tests/studio-browser-e2e.cjs"
      - ".github/workflows/studio-us1-browser-e2e.yml"
  pull_request:
    paths:
      - "web/studio.html"
      - "web/studio.js"
      - "web/vendor/**"
      - "tests/studio-browser-e2e.cjs"
      - ".github/workflows/studio-us1-browser-e2e.yml"

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/airtrajectory-studio-http.log 2>&1 &
          echo $! > /tmp/airtrajectory-studio-http.pid
          sleep 2
      - name: Verify US1 in Chromium
        run: node tests/studio-browser-e2e.cjs
      - name: Verify non-fixed layout in Python runtime
        run: |
          python3 -m pip install -e .
          python3 - <<'PY'
          import json
          from pathlib import Path
          from airtrajectory.layout import LayoutContract
          from airtrajectory.topology_acceptance import verify_topology_runtime
          layout=LayoutContract.from_file("artifacts/studio/edited-layout.json")
          receipt=verify_topology_runtime(layout)
          assert receipt["status"]=="PASS",receipt
          assert len(layout.rooms)==4
          assert len(layout.walls)==6
          assert len(layout.openings)==6
          Path("artifacts/studio/topology-acceptance.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\\n")
          print("PASS: edited topology reached shared physical and trajectory runtime")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-us1-browser-acceptance
          path: artifacts/studio/
          if-no-files-found: warn
