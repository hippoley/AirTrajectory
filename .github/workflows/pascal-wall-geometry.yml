name: Pascal Wall Geometry
on:
  push:
    branches: [main]
    paths:
      - 'web/pascal-wall-normalize.js'
      - 'web/pascal-scene-webgl.js'
      - 'tests/test_pascal_wall_normalize.mjs'
      - '.github/workflows/pascal-wall-geometry.yml'
  pull_request:
    paths:
      - 'web/pascal-wall-normalize.js'
      - 'web/pascal-scene-webgl.js'
      - 'tests/test_pascal_wall_normalize.mjs'
      - '.github/workflows/pascal-wall-geometry.yml'
jobs:
  wall-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module tests/test_pascal_wall_normalize.mjs
