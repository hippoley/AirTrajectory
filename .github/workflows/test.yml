name: test

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python examples/single_room_rollout.py
      - run: python examples/export_web_scenarios.py
      - run: python -c 'import json; p=json.load(open("web/data/scenarios.json")); assert len(p["scenarios"]) == 4; assert p["baseline"] == "exhaustive-opening-search-v1"; assert all(s["frames"] for s in p["scenarios"]); assert all(set(s["metrics"]) == {"iaq","flow","motion","return"} for s in p["scenarios"])'


  contam-real:
    runs-on: windows-latest
    env:
      SPATIALRUNTIME_COMMIT_SHA: d123ab9a5310cb9ce15d9e82630828a0d32211f4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout SpatialRuntime consumer dependency
        uses: actions/checkout@v4
        with:
          repository: hippoley/SpatialRuntime
          ref: ${{ env.SPATIALRUNTIME_COMMIT_SHA }}
          path: _spatialruntime
      - name: Verify pinned SpatialRuntime revision
        shell: bash
        run: test "$(git -C _spatialruntime rev-parse HEAD)" = "$SPATIALRUNTIME_COMMIT_SHA"
      - name: Install official contamxpy runtime and SpatialRuntime
        run: |
          python -m pip install -e ".[contam]"
          python -m pip install -e "_spatialruntime"
      - name: Inspect installed contamxpy API
        run: |
          python -c "import inspect,contamxpy; print('cxLib', inspect.signature(contamxpy.cxLib)); print('setupSimulation', inspect.signature(contamxpy.cxLib.setupSimulation)); print('doSimStep', inspect.signature(contamxpy.cxLib.doSimStep)); print('endSimulation', inspect.signature(contamxpy.cxLib.endSimulation))"
      - name: Download official contamxpy source demo
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          import urllib.request

          Path("_contam_sdist").mkdir(exist_ok=True)
          with urllib.request.urlopen("https://pypi.org/pypi/contamxpy/0.0.9/json") as response:
              metadata=json.load(response)
          sdist=next(item for item in metadata["urls"] if item["packagetype"]=="sdist")
          target=Path("_contam_sdist/contamxpy-0.0.9.tar.gz")
          urllib.request.urlretrieve(sdist["url"], target)
          print("downloaded", target, "from", sdist["url"])
          '@ | python -
      - name: Extract a real NIST demo PRJ
        shell: pwsh
        run: |
          @'
          import glob, tarfile
          archives=glob.glob("_contam_sdist/contamxpy-0.0.9.tar.gz")
          assert archives, "contamxpy source archive missing"
          with tarfile.open(archives[0]) as tf:
              tf.extractall("_contam_src")
          matches=glob.glob("_contam_src/**/demo_files/test_OneZoneSS-UseApi.prj",recursive=True)
          if not matches:
              matches=glob.glob("_contam_src/**/*.prj",recursive=True)
          assert matches, "official contamxpy source contains no PRJ demo"
          open("_contam_prj.txt","w",encoding="utf-8").write(matches[0])
          print(matches[0])
          '@ | python -
      - name: Probe real contamxpy continuation surface
        shell: pwsh
        run: |
          $prj = (Get-Content _contam_prj.txt -Raw).Trim()
          python examples/probe_contam_continuation.py "$prj" --out artifacts/contam-continuation-capability.json | Tee-Object -FilePath contam-continuation-capability.log
          if (-not (Select-String -Path contam-continuation-capability.log -Pattern "CONTAM_CONTINUATION_CAPABILITY_PROBED")) { exit 1 }
          @'
          import json
          p=json.load(open("artifacts/contam-continuation-capability.json",encoding="utf-8"))
          assert p["state_reinjection_verified"] is False
          assert len(p["probe_sha256"])==64
          assert "continuity_test_required" in p
          print("CONTAM_CONTINUATION_CAPABILITY_RECEIPT_VERIFIED")
          '@ | python -
      - name: Execute real CONTAM engine
        shell: pwsh
        run: |
          $prj = (Get-Content _contam_prj.txt -Raw).Trim()
          python examples/contam_smoke.py "$prj" --zone 1 --contaminant 1 --steps 2 | Tee-Object -FilePath contam-smoke.json
          if (-not (Select-String -Path contam-smoke.json -Pattern "CONTAM_EXECUTED")) { exit 1 }
      - name: Generate AirTrajectory multi-space PRJ
        shell: pwsh
        run: |
          python examples/generate_multispace_contam_prj.py --out artifacts/multispace-generated.prj --provenance-out artifacts/multispace-generated.prj.json
          if (-not (Test-Path artifacts/multispace-generated.prj)) { exit 1 }
          if (-not (Select-String -Path artifacts/multispace-generated.prj -Pattern "3 ! zones:")) { exit 1 }
          if (-not (Select-String -Path artifacts/multispace-generated.prj -Pattern "5 ! flow paths:")) { exit 1 }
      - name: Load generated PRJ with real ContamX
        shell: pwsh
        run: |
          python examples/contam_generated_smoke.py artifacts/multispace-generated.prj --expected-zones 3 --expected-paths 5 --provenance artifacts/multispace-generated.prj.json | Tee-Object -FilePath generated-contam-smoke.json
          if (-not (Select-String -Path generated-contam-smoke.json -Pattern "GENERATED_CONTAM_DYNAMIC_CONTROL_EXECUTED")) { exit 1 }
      - name: Generate PRJ for unified trajectory
        shell: pwsh
        run: |
          python examples/generate_multispace_contam_prj.py --out artifacts/multispace-trajectory.prj --provenance-out artifacts/multispace-trajectory.prj.json
      - name: Run unified multi-window trajectory on real ContamX
        timeout-minutes: 3
        shell: pwsh
        run: |
          python examples/run_multispace_contam_demo.py artifacts/multispace-trajectory.prj artifacts/multispace-trajectory.prj.json --steps 2 --out artifacts/multispace-contam-trajectory.json | Tee-Object -FilePath generated-contam-trajectory.log
          if (-not (Select-String -Path generated-contam-trajectory.log -Pattern "GENERATED_CONTAM_TRAJECTORY_EXECUTED")) { exit 1 }
      - name: Generate transient PRJ for counterfactual dynamics
        shell: pwsh
        run: |
          python examples/generate_multispace_contam_prj.py --prj-profile examples/contam_prj_profile.transient.example.json --out artifacts/multispace-transient.prj --provenance-out artifacts/multispace-transient.prj.json
          if (-not (Select-String -Path artifacts/multispace-transient.prj -Pattern "contaminant simulation: transient")) { exit 1 }
      - name: Probe setZoneAddMass behavior on real transient ContamX
        shell: pwsh
        run: |
          python examples/probe_contam_zone_add_mass.py artifacts/multispace-transient.prj --zone 1 --contaminant 0 --mass 1e-6 --out artifacts/contam-zone-add-mass.json | Tee-Object -FilePath contam-zone-add-mass.log
          if (-not (Select-String -Path contam-zone-add-mass.log -Pattern "CONTAM_ZONE_ADD_MASS_AB_PROBED")) { exit 1 }
          @'
          import json
          p=json.load(open("artifacts/contam-zone-add-mass.json",encoding="utf-8"))
          assert p["state_reinjection_verified"] is False
          assert p["semantics_verified"] is False
          e=p["effects"]
          assert "immediate_1x" in e
          assert "after_step_1x" in e
          print("CONTAM_ZONE_ADD_MASS_BEHAVIOR_RECEIPT_VERIFIED", e["immediate_1x"], e["after_step_1x"], e["immediate_2x_over_1x"], e["after_step_2x_over_1x"])
          '@ | python -
      - name: Verify PRJ Section 15 reseed continuity on real ContamX
        shell: pwsh
        run: |
          python examples/contam_reseed_continuity_smoke.py artifacts/multispace-transient.prj --out artifacts/contam-reseed-continuity.json --reseeded-prj artifacts/multispace-transient.reseeded.prj | Tee-Object -FilePath contam-reseed-continuity.log
          if (-not (Select-String -Path contam-reseed-continuity.log -Pattern "REAL_CONTAM_PRJ_RESEED_CONTINUITY_EXECUTED")) { exit 1 }
          @'
          import json
          p=json.load(open("artifacts/contam-reseed-continuity.json",encoding="utf-8"))
          c=p["comparison"]
          assert c["status"]=="PASS", c
          assert c["state_reinjection_verified"] is True
          assert p["full_restart_verified"] is False
          assert len(c["comparison_sha256"])==64
          assert len(p["reseed_receipt"]["reseeded_prj_sha256"])==64
          print("CONTAM_PRJ_RESEED_CONTINUITY_VERIFIED", c["errors"])
          '@ | python -
      - name: Run transient counterfactual on real ContamX
        timeout-minutes: 3
        shell: pwsh
        run: |
          python examples/contam_transient_fork_smoke.py artifacts/multispace-transient.prj artifacts/multispace-transient.prj.json | Tee-Object -FilePath transient-contam-counterfactual.log
          if (-not (Select-String -Path transient-contam-counterfactual.log -Pattern "TRANSIENT_CONTAM_COUNTERFACTUAL_EXECUTED")) { exit 1 }
      - name: Run receding-horizon Joint on real ContamX
        timeout-minutes: 5
        shell: pwsh
        run: |
          python examples/run_contam_joint_closed_loop.py artifacts/multispace-transient.prj artifacts/multispace-transient.prj.json --spatialruntime-verify --control-steps 2 --prediction-horizon-steps 3 --out artifacts/contam-joint-closed-loop.json | Tee-Object -FilePath contam-joint-closed-loop.log
          if (-not (Select-String -Path contam-joint-closed-loop.log -Pattern "REAL_CONTAM_RECEDING_HORIZON_JOINT_EXECUTED")) { exit 1 }
          @'
          import json
          p=json.load(open("artifacts/contam-joint-closed-loop.json",encoding="utf-8"))
          r=p["receipt"]
          assert r["closed_loop_replanning_executed"] is True
          assert len(r["steps"])==2
          assert r["backend_capability"]["state_reinjection_verified"] is True
          assert all(s["evaluation_evidence"]["origin_kind"]=="prj-reseed-verified" for s in r["steps"])
          sr=p["spatialruntime_consumer"]
          assert sr["verified"] is True
          assert sr["spatialruntime_commit_sha"]=="d123ab9a5310cb9ce15d9e82630828a0d32211f4"
          assert sr["zone_ids"]==["bedroom","living","study"]
          assert sr["flow_path_ids"]==["D1","D2","W1","W2","W3"]
          for step_index,s in enumerate(r["steps"]):
              evidence=s["evaluation_evidence"]
              reseed=evidence["prj_reseed_receipt"]
              rows=evidence["spatialruntime_result_consumers"]
              assert len(rows)==s["candidate_count"]
              assert all(row["verified"] is True for row in rows)
              assert all(row["spatialruntime_commit_sha"]=="d123ab9a5310cb9ce15d9e82630828a0d32211f4" for row in rows)
              assert all(row["adapter_id"]=="contam-project-v0.9" for row in rows)
              assert all(row["source_project_sha256"]==sr["project_sha256"] for row in rows)
              assert all(row["execution_project_sha256"]==reseed["reseeded_prj_sha256"] for row in rows)
              assert all(row["project_sha256"]==row["execution_project_sha256"] for row in rows)
              assert all(row["reseeded_execution"] is True for row in rows)
              assert all(len(row["reseed_receipt_sha256"])==64 for row in rows)
              assert all(row["native_result_source"]=="airtrajectory_real_contam_branch" for row in rows)
              assert all(row["zone_count"]==3 for row in rows)
              assert all(row["flow_path_count"]==5 for row in rows)
              assert all(row["max_abs_co2_ppm_delta"]==0 for row in rows)
              assert all(row["max_abs_mass_flow_kg_s_delta"]==0 for row in rows)
              assert all(len(row["adapter_fingerprint"])==64 for row in rows)
              assert all(len(row["request_hash"])==64 for row in rows)
              assert all(len(row["result_hash"])==64 for row in rows)
              assert all(len(row["feedback_sha256"])==64 for row in rows)
              assert all(len(row["receipt_sha256"])==64 for row in rows)
              assert len({row["request_hash"] for row in rows})==len(rows)
          assert r["steps"][0]["next_origin_sha256"]==r["steps"][1]["origin_sha256"]
          print("REAL_CONTAM_RECEDING_HORIZON_RECEIPT_VERIFIED", [s["selected_label"] for s in r["steps"]])
          '@ | python -
      - name: Replan real ContamX from a physical-origin contract fixture
        timeout-minutes: 5
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          from airtrajectory.demo_runtime import DemoRuntimeSnapshot
          from airtrajectory.layout import LayoutContract

          def sha(payload):
              raw=json.dumps(payload,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          provenance=json.load(open("artifacts/multispace-transient.prj.json",encoding="utf-8"))
          layout=LayoutContract.from_file("web/data/home_topology.fixed.json")
          topology=layout.to_building_topology()
          snapshot=DemoRuntimeSnapshot.resolve(layout)
          origin={
              "co2_ppm":{
                  zone:float(provenance["initial_co2_ppm"][zone])
                  for zone in sorted(topology.zones)
              },
              "opening_pct":{
                  opening_id:float(snapshot.opening_states[opening_id])
                  for opening_id in sorted(topology.openings)
              },
              "scalar_values":{"rain":0.0},
          }
          origin["co2_ppm"]["living"] += 17.0
          origin["opening_pct"]["W1"] = 0.2
          payload={
              "schema_version":"0.1",
              "source":"windowpilot-physical-reconcile-v1",
              "zone_id":"living",
              "opening_id":"W1",
              "physical_reconcile_sha256":"0"*64,
              "terminal_snapshot_sha256":"1"*64,
              "origin":origin,
              "contract_fixture":True,
              "evidence_boundary":"synthetic CI contract fixture; not field evidence",
          }
          receipt={
              **payload,
              "origin_sha256":sha(origin),
              "physical_origin_receipt_sha256":sha(payload),
          }
          with open("artifacts/physical-origin-ci-fixture.json","w",encoding="utf-8") as fh:
              json.dump(receipt,fh,indent=2,sort_keys=True)
          print("PHYSICAL_ORIGIN_CONTRACT_FIXTURE_CREATED",receipt["origin_sha256"])
          '@ | python -
          python examples/run_contam_joint_closed_loop.py artifacts/multispace-transient.prj artifacts/multispace-transient.prj.json --spatialruntime-verify --control-steps 1 --prediction-horizon-steps 3 --physical-origin-receipt artifacts/physical-origin-ci-fixture.json --out artifacts/contam-replan-from-physical-origin.json | Tee-Object -FilePath contam-replan-from-physical-origin.log
          if (-not (Select-String -Path contam-replan-from-physical-origin.log -Pattern "REAL_CONTAM_REPLAN_FROM_PHYSICAL_ORIGIN")) { exit 1 }
          @'
          import json
          p=json.load(open("artifacts/contam-replan-from-physical-origin.json",encoding="utf-8"))
          fixture=json.load(open("artifacts/physical-origin-ci-fixture.json",encoding="utf-8"))
          r=p["receipt"]
          assert p["physical_origin_consumed"] is True
          assert p["field_validated"] is False
          assert p["physical_origin_evidence"]["receipt_sha256"]==fixture["physical_origin_receipt_sha256"]
          assert p["physical_origin_evidence"]["origin_sha256"]==fixture["origin_sha256"]
          assert r["initial_origin_sha256"]==fixture["origin_sha256"]
          assert r["steps"][0]["origin_sha256"]==fixture["origin_sha256"]
          evidence=r["steps"][0]["evaluation_evidence"]
          projection=evidence["scalar_projection"]
          assert evidence["controller_origin_sha256"]==fixture["origin_sha256"]
          assert projection["scalar_projection_applied"] is True
          assert projection["controller_scalar_values"]=={"rain":0.0}
          assert projection["contam_scalar_values"]=={}
          assert projection["dropped_scalar_values"]=={"rain":0.0}
          sr=p["spatialruntime_consumer"]
          assert sr["verified"] is True
          assert sr["spatialruntime_commit_sha"]=="d123ab9a5310cb9ce15d9e82630828a0d32211f4"
          assert sr["zone_ids"]==["bedroom","living","study"]
          assert sr["flow_path_ids"]==["D1","D2","W1","W2","W3"]
          rows=evidence["spatialruntime_result_consumers"]
          reseed=evidence["prj_reseed_receipt"]
          assert len(rows)==r["steps"][0]["candidate_count"]
          assert all(row["verified"] is True for row in rows)
          assert all(row["adapter_id"]=="contam-project-v0.9" for row in rows)
          assert all(row["source_project_sha256"]==sr["project_sha256"] for row in rows)
          assert all(row["execution_project_sha256"]==reseed["reseeded_prj_sha256"] for row in rows)
          assert all(row["project_sha256"]==row["execution_project_sha256"] for row in rows)
          assert all(row["reseeded_execution"] is True for row in rows)
          assert all(row["max_abs_co2_ppm_delta"]==0 for row in rows)
          assert all(row["max_abs_mass_flow_kg_s_delta"]==0 for row in rows)
          assert all(len(row["request_hash"])==64 for row in rows)
          assert all(len(row["result_hash"])==64 for row in rows)
          assert all(len(row["receipt_sha256"])==64 for row in rows)
          assert len({row["request_hash"] for row in rows})==len(rows)
          assert r["control_steps"]==1
          assert r["closed_loop_replanning_executed"] is False
          print("REAL_CONTAM_PHYSICAL_ORIGIN_REPLAN_VERIFIED",r["steps"][0]["selected_label"],fixture["origin_sha256"],projection)
          '@ | python -
      - name: Compare adaptive vs Independent closed-loop on real ContamX
        timeout-minutes: 8
        shell: pwsh
        run: |
          python examples/run_contam_joint_closed_loop.py artifacts/multispace-transient.prj artifacts/multispace-transient.prj.json --control-steps 3 --prediction-horizon-steps 3 --candidate-mode adaptive --out artifacts/contam-closed-loop-adaptive.json | Tee-Object -FilePath contam-closed-loop-adaptive.log
          python examples/run_contam_joint_closed_loop.py artifacts/multispace-transient.prj artifacts/multispace-transient.prj.json --control-steps 3 --prediction-horizon-steps 3 --candidate-mode independent-only --out artifacts/contam-closed-loop-independent.json | Tee-Object -FilePath contam-closed-loop-independent.log
          python examples/compare_contam_closed_loop_modes.py artifacts/contam-closed-loop-adaptive.json artifacts/contam-closed-loop-independent.json --out artifacts/contam-closed-loop-comparison.json | Tee-Object -FilePath contam-closed-loop-comparison.log
          if (-not (Select-String -Path contam-closed-loop-comparison.log -Pattern "REAL_CONTAM_CLOSED_LOOP_MODES_COMPARED")) { exit 1 }
          @'
          import json
          p=json.load(open("artifacts/contam-closed-loop-comparison.json",encoding="utf-8"))
          c=p["comparison"]
          assert p["control_steps"]==3
          assert p["prediction_horizon_steps"]==3
          assert c["outcome"] in ("WIN","TIE","LOSS")
          assert len(c["comparison_sha256"])==64
          assert c["adaptive"]["metrics"]["control_steps"]==3
          assert c["independent"]["metrics"]["control_steps"]==3
          print("REAL_CONTAM_CLOSED_LOOP_COMPARISON_VERIFIED", c["outcome"], c["objective_improvement"], c["adaptive"]["metrics"], c["independent"]["metrics"])
          '@ | python -
      - name: Run Independent vs Joint Golden Case on real ContamX
        timeout-minutes: 4
        shell: pwsh
        run: |
          python examples/run_contam_joint_golden_case.py artifacts/multispace-transient.prj artifacts/multispace-transient.prj.json --spatialruntime-verify --out artifacts/contam-joint-golden-case.json | Tee-Object -FilePath contam-joint-golden-case.log
          if (-not (Select-String -Path contam-joint-golden-case.log -Pattern "REAL_CONTAM_JOINT_GOLDEN_CASE_EXECUTED")) { exit 1 }
          @'
          import json
          p=json.load(open("artifacts/contam-joint-golden-case.json",encoding="utf-8"))
          c=p["comparison"]
          assert c["status"]=="PASS"
          assert c["non_regression"] is True
          assert c["joint_vs_independent_outcome"] in ("WIN","TIE")
          assert len(c["comparison_sha256"])==64
          assert p["golden_case"]["time_step_s"]==60
          assert p["golden_case"]["horizon_steps"]==3
          assert len(p["branches"])>=2
          sr=p["spatialruntime_consumer"]
          assert sr["verified"] is True
          assert sr["spatialruntime_commit_sha"]=="d123ab9a5310cb9ce15d9e82630828a0d32211f4"
          assert sr["zone_ids"]==["bedroom","living","study"]
          assert sr["flow_path_ids"]==["D1","D2","W1","W2","W3"]
          assert sr["project_sha256"]==p["comparison"]["prj_sha256"]
          assert len(sr["binding_registry_fingerprint"])==64
          assert len(sr["receipt_sha256"])==64
          srr=p["spatialruntime_result_consumers"]
          assert len(srr)==len(p["branches"])
          assert all(row["verified"] is True for row in srr)
          assert all(row["spatialruntime_commit_sha"]=="d123ab9a5310cb9ce15d9e82630828a0d32211f4" for row in srr)
          assert all(row["adapter_id"]=="contam-project-v0.9" for row in srr)
          assert all(row["native_result_source"]=="airtrajectory_real_contam_branch" for row in srr)
          assert all(row["zone_count"]==3 for row in srr)
          assert all(row["flow_path_count"]==5 for row in srr)
          assert all(row["max_abs_co2_ppm_delta"]==0 for row in srr)
          assert all(row["max_abs_mass_flow_kg_s_delta"]==0 for row in srr)
          assert all(len(row["adapter_fingerprint"])==64 for row in srr)
          assert all(len(row["request_hash"])==64 for row in srr)
          assert all(len(row["result_hash"])==64 for row in srr)
          assert all(len(row["feedback_sha256"])==64 for row in srr)
          assert all(len(row["receipt_sha256"])==64 for row in srr)
          assert [row["branch_label"] for row in srr]==[b["label"] for b in p["branches"]]
          assert all(set(b["co2_series_by_zone"])=={"living","bedroom","study"} for b in p["branches"])
          assert all(all(len(v)==3 for v in b["co2_series_by_zone"].values()) for b in p["branches"])
          print("JOINT_GOLDEN_CASE_RECEIPT_VERIFIED", c["joint_vs_independent_outcome"], c["objective_improvement"])
          '@ | python -

      - name: Rank topology-derived VentilationPaths on real ContamX
        timeout-minutes: 4
        shell: pwsh
        run: |
          python examples/run_contam_joint_golden_case.py artifacts/multispace-transient.prj artifacts/multispace-transient.prj.json --spatialruntime-verify --derive-path-candidates --path-intensities 35,55,75 --out artifacts/contam-ventilation-path-ranking.json | Tee-Object -FilePath contam-ventilation-path-ranking.log
          if (-not (Select-String -Path contam-ventilation-path-ranking.log -Pattern "REAL_CONTAM_JOINT_GOLDEN_CASE_EXECUTED")) { exit 1 }
          @'
          import json
          p=json.load(open("artifacts/contam-ventilation-path-ranking.json",encoding="utf-8"))
          assert p["candidate_source"]=="topology-derived-ventilation-paths"
          rows=p["ventilation_path_candidates"]
          assert len(rows)==9
          labels={row["label"] for row in rows}
          assert "ventpath:W1->W2@35" in labels
          assert "ventpath:W1->W3@55" in labels
          assert "ventpath:W2->W3@75" in labels
          c=p["comparison"]
          assert c["status"]=="PASS"
          assert c["non_regression"] is True
          assert len(c["comparison_sha256"])==64
          sr=p["spatialruntime_consumer"]
          assert sr["verified"] is True
          assert sr["spatialruntime_commit_sha"]=="d123ab9a5310cb9ce15d9e82630828a0d32211f4"
          assert sr["zone_ids"]==["bedroom","living","study"]
          assert sr["flow_path_ids"]==["D1","D2","W1","W2","W3"]
          srr=p["spatialruntime_result_consumers"]
          assert len(srr)==len(p["branches"])
