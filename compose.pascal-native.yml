# The complete upstream Pascal application (not the lightweight React embed).
# First run: bash scripts/start-full-editor.sh
# Source is pinned under .upstream/pascal-editor and retains its MIT notices.
services:
  pascal-editor:
    build:
      context: ./.upstream/pascal-editor
      dockerfile: Dockerfile
    ports:
      - "${PASCAL_EDITOR_PORT:-3002}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      PASCAL_DATA_DIR: /data
    volumes:
      - pascal-scenes:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch("http://127.0.0.1:3000").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 45s
volumes:
  pascal-scenes: {}
