[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airtrajectory"
version = "0.1.0"
description = "Trajectory-native learning for multi-zone ventilation control"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "hippoley"}]
dependencies = []

[project.optional-dependencies]
telemetry = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
contam = ["contamxpy==0.0.9"]

[tool.setuptools]
packages = ["airtrajectory"]
